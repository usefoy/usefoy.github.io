<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ناقل — صانع المحتوى</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700;900&family=Noto+Naskh+Arabic:wght@500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --ink:#1B1F1C;
    --paper:#EFEDE6;
    --accent:#A6402F;
    --sage:#6B7A6E;
    --gold:#8A6D3B;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    font-family:'Noto Naskh Arabic', serif;
    background:#0e0f0d;
    color:var(--paper);
    width:100%;
    overflow-x:hidden;
  }
  .workspace{
    display:flex;
    flex-direction:column;
    width:100%;
    padding:16px;
    gap:20px;
  }
  .panel{
    width:100%;
    background:#181a17;
    border-radius:14px;
    padding:18px;
  }
  .panel h1{
    font-family:'Noto Kufi Arabic', sans-serif;
    font-size:19px;
    margin:0 0 4px;
    color:var(--paper);
  }
  .panel p.sub{
    font-size:13px;
    color:#9a9a92;
    margin:0 0 16px;
  }
  label{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.05em;
    color:var(--sage);
    text-transform:uppercase;
    margin:14px 0 6px;
  }
  select, textarea, input[type=text]{
    width:100%;
    background:#0e0f0d;
    border:1px solid #33352f;
    color:var(--paper);
    border-radius:8px;
    padding:10px 12px;
    font-family:'Noto Naskh Arabic', serif;
    font-size:15px;
    resize:vertical;
  }
  textarea{min-height:70px;}
  input[type=file]{
    width:100%;
    color:#9a9a92;
    font-size:12px;
  }
  button#dl{
    margin-top:20px;
    width:100%;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:15px;
    font-family:'Noto Kufi Arabic', sans-serif;
    font-weight:700;
    font-size:16px;
    cursor:pointer;
  }
  button#dl:active{opacity:.85;}
  .hint{
    font-size:11px;
    color:#6b6d64;
    margin-top:10px;
    line-height:1.6;
  }

  .stage{
    width:100%;
    display:flex;
    justify-content:center;
    background:#0e0f0d;
    border-radius:14px;
    padding:12px 0;
  }
  #cardWrap{
    width:100%;
    max-width:420px;
    aspect-ratio: 1080 / 1920;
    position:relative;
    overflow:hidden;
    border-radius:10px;
  }
  #card{
    width:1080px;
    height:1920px;
    position:absolute;
    top:0;
    right:0;
    transform-origin: top right;
    display:flex;
    flex-direction:column;
    overflow:hidden;

  /* fixed header zone reserved for the baked-in logo */
  .content-zone{
    margin-top:560px;
    height:1660px; /* 1920 - 560, fixed budget */
    display:flex;
    flex-direction:column;
    padding:0 44px;
    overflow:hidden;
  }

  .body{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    overflow:hidden;
    justify-content:flex-start;
  }
  .body.no-media{
    justify-content:center;
  }

  .text-block{
    width:100%;
    flex-shrink:0;
  }

  .title-txt{
    font-family:'Noto Kufi Arabic', sans-serif;
    font-weight:900;
    font-size:88px;
    color:var(--accent);
    line-height:1.15;
    word-wrap:break-word;
    margin-bottom:38px; /* empty break instead of a rule */
  }

  .subtitle-txt{
    font-family:'Noto Kufi Arabic', sans-serif;
    font-weight:700;
    font-size:58px;
    color:var(--gold);
    line-height:1.3;
    margin-bottom:22px;
    word-wrap:break-word;
  }

  .content-txt{
    font-family:'Noto Naskh Arabic', sans-serif;
    font-weight:700;
    font-size:56px;
    color:var(--ink);
    line-height:1.5;
    white-space:pre-wrap;
    word-wrap:break-word;
  }

  .media{
    width:100%;
    display:none;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    margin-top:30px;
  }
  .body.has-media .media{
    display:flex;
    flex: 0 0 50%;
    align-items:center;
    justify-content:center;
    min-height:0;
  }
  .media img, .media video{
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit:contain;
    display:block;
  }

  .footer{
    width:100%;
    flex-shrink:0;
    padding:24px 0 56px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  .footer .source{
    font-family:'Noto Naskh Arabic', serif;
    font-weight:700;
    font-size:26px;
    color:var(--ink);
  }

  #status{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--sage);
    text-align:center;
    min-height:16px;
  }
</style>
</head>
<body>

<div class="workspace">

  <div class="panel">
    <h1>ناقل —تصميم المحتوى</h1>

    <label>العنوان </label>
    <input type="text" id="title" value="" placeholder="(مثال: عاجل / الآن)">

    <label>العنوان الفرعي (اختياري)</label>
    <input type="text" id="subtitle" value="" placeholder="عنوان ثانوي">

    <label>المحتوى</label>
    <textarea id="content" placeholder="الكلام هنا"></textarea>

    <label>صورة أو فيديو (اختياري)</label>
    <input type="file" id="mediaInput" accept="image/*,video/*">

    <label>المصدر (اختياري)</label>
    <input type="text" id="source" placeholder="مثال: واس — سبق">

  </div>

  <div class="stage">
    <div id="cardWrap">
      <div id="card">
        <div class="content-zone">
          <div class="body no-media" id="body">
            <div class="text-block">
              <div class="title-txt" id="titleOut"></div>
              <div class="subtitle-txt" id="subtitleOut" style="display:none;"></div>
              <div class="content-txt" id="contentOut"></div>
            </div>
            <div class="media" id="media"></div>
          </div>
          <div class="footer" id="footer">
            <div class="source" id="sourceOut" style="display:none;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="panel">
    <button id="dl">تحميل الصورة</button>
    <p id="status"></p>
  </div>

</div>

<script>
const $ = id => document.getElementById(id);
let mediaKind = null; // 'image' | 'video' | null

const TITLE_MAX=88, TITLE_MIN=40;
const SUB_MAX=58, SUB_MIN=28;
const CONTENT_MAX=46, CONTENT_MIN=24;

function fitCard(){
  const wrap = $('cardWrap');
  const scale = wrap.clientWidth / 1080;
  $('card').style.transform = 'scale(' + scale + ')';
}
window.addEventListener('resize', fitCard);
window.addEventListener('load', fitCard);

function autoFit(){
  const body = $('body');
  const title = $('titleOut');
  const subtitle = $('subtitleOut');
  const content = $('contentOut');

  title.style.fontSize = TITLE_MAX + 'px';
  subtitle.style.fontSize = SUB_MAX + 'px';
  content.style.fontSize = CONTENT_MAX + 'px';

  let guard = 0;
  while(body.scrollHeight > body.clientHeight && guard < 60){
    const cs = parseFloat(getComputedStyle(content).fontSize);
    const ss = parseFloat(getComputedStyle(subtitle).fontSize);
    const ts = parseFloat(getComputedStyle(title).fontSize);

    if(cs > CONTENT_MIN){ content.style.fontSize = (cs-2)+'px'; guard++; continue; }
    if(subtitle.style.display !== 'none' && ss > SUB_MIN){ subtitle.style.fontSize = (ss-2)+'px'; guard++; continue; }
    if(ts > TITLE_MIN){ title.style.fontSize = (ts-2)+'px'; guard++; continue; }
    break;
  }
}

function refresh(){
  $('titleOut').textContent = $('title').value || '';

  const sub = $('subtitle').value.trim();
  const subEl = $('subtitleOut');
  if(sub){ subEl.textContent = sub; subEl.style.display = 'block'; }
  else { subEl.style.display = 'none'; }

  $('contentOut').textContent = $('content').value;

  const src = $('source').value.trim();
  const srcEl = $('sourceOut');
  if(src){ srcEl.textContent = 'المصدر: ' + src; srcEl.style.display = 'block'; }
  else { srcEl.style.display = 'none'; }


  autoFit();
}
['title','subtitle','content','source'].forEach(id=>{
  $(id).addEventListener('input', refresh);
});

$('mediaInput').addEventListener('change', e=>{
  const file = e.target.files[0];
  const box = $('media');
  const body = $('body');
  if(!file){
    box.innerHTML=''; mediaKind=null;
    body.classList.remove('has-media'); body.classList.add('no-media');
    autoFit();
    return;
  }
  const reader = new FileReader();
  reader.onload = ev=>{
    if(file.type.startsWith('video')){
      mediaKind = 'video';
      box.innerHTML = '<video id="mediaVideo" src="' + ev.target.result + '" autoplay muted loop playsinline></video>';
    } else {
      mediaKind = 'image';
      box.innerHTML = '<img src="' + ev.target.result + '">';
    }
    body.classList.remove('no-media'); body.classList.add('has-media');
    autoFit();
  };
  reader.readAsDataURL(file);
});

async function prepForCapture(){
  if(mediaKind === 'video'){
    const vid = document.getElementById('mediaVideo');
    if(vid){
      const c = document.createElement('canvas');
      c.width = vid.videoWidth || 800;
      c.height = vid.videoHeight || 800;
      const ctx = c.getContext('2d');
      try{ ctx.drawImage(vid, 0, 0, c.width, c.height); }catch(e){}
      const frameUrl = c.toDataURL('image/png');
      const img = document.createElement('img');
      img.id = 'mediaVideoFrame';
      img.src = frameUrl;
      vid.style.display = 'none';
      vid.insertAdjacentElement('afterend', img);
    }
  }
}
function restoreAfterCapture(){
  const frame = document.getElementById('mediaVideoFrame');
  if(frame) frame.remove();
  const vid = document.getElementById('mediaVideo');
  if(vid) vid.style.display = '';
}

document.getElementById('dl').addEventListener('click', async ()=>{
  const status = $('status');
  status.textContent = 'جارٍ إنشاء الصورة...';
  const card = document.getElementById('card');
  const originalTransform = card.style.transform;
  card.style.transform = 'none';

  await prepForCapture();

  html2canvas(card, {scale:1, backgroundColor:null, width:1080, height:1920, useCORS:true, allowTaint:true}).then(canvas=>{
    card.style.transform = originalTransform;
    restoreAfterCapture();

    canvas.toBlob(function(blob){
      if(!blob){
        status.textContent = 'تعذر إنشاء الصورة، حاول مرة أخرى';
        return;
      }
      const url = URL.createObjectURL(blob);

      try{
        const link = document.createElement('a');
        link.download = 'naqil-news-card.png';
        link.href = url;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }catch(e){}

      const win = window.open();
      if(win){
        win.document.write(
          '<html dir="rtl"><head><title>ناقل</title></head><body style="margin:0;background:#111;display:flex;flex-direction:column;align-items:center;">' +
          '<p style="color:#eee;font-family:sans-serif;padding:14px;text-align:center;">اضغط مطولاً على الصورة واختر "حفظ الصورة"</p>' +
          '<img src="' + url + '" style="max-width:100%;height:auto;display:block;">' +
          '</body></html>'
        );
        status.textContent = 'فُتحت الصورة في نافذة جديدة — اضغط مطولاً واحفظها';
      } else {
        status.textContent = 'تم إنشاء الصورة — إن لم يبدأ التحميل، اسمح بالنوافذ المنبثقة';
      }
      setTimeout(()=>{ status.textContent=''; }, 6000);
    }, 'image/png');

  }).catch(err=>{
    card.style.transform = originalTransform;
    restoreAfterCapture();
    status.textContent = 'حدث خطأ، حاول مرة أخرى';
    console.error(err);
  });
});

refresh();
fitCard();
</script>

</body>
</html>
